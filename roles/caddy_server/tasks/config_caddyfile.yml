---
- name: Caddyfile is present
  template:
    src: Caddyfile.j2
    dest: "{{ caddy_server_caddyfile_dest }}"
    owner: root
    group: root
    mode: "644"
  notify: Reload Caddy

- name: caddy-api service is stopped and disabled
  ansible.builtin.systemd:
    name: "caddy-api"
    state: stopped
    enabled: false

- name: caddy service is running and enabled
  ansible.builtin.systemd:
    name: "caddy"
    state: started
    enabled: true
